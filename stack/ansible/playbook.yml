---
- name: Baseline for AWG relays (cross-platform backend)
  hosts: all
  become: true
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - wireguard
          - nftables
          - curl
          - ca-certificates
        state: present
        update_cache: true

    - name: Enable IPv4 forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-awg-forwarding.conf
        content: |
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
        mode: "0644"
      notify: Reload sysctl

    - name: Deploy minimal nftables baseline
      ansible.builtin.copy:
        dest: /etc/nftables.conf
        mode: "0644"
        content: |
          flush ruleset

          table inet filter {
            chain input {
              type filter hook input priority 0;
              policy drop;

              ct state established,related accept
              iif "lo" accept
              ip saddr { {{ authorized_admin_cidrs | join(', ') }} } tcp dport 22 accept
              udp dport {{ awg_listen_port }} accept
            }

            chain forward {
              type filter hook forward priority 0;
              policy drop;
              ct state established,related accept
              iifname "{{ awg_interface }}" oifname "{{ egress_nic }}" accept
              iifname "{{ egress_nic }}" oifname "{{ awg_interface }}" accept
            }

            chain output {
              type filter hook output priority 0;
              policy accept;
            }
          }

          table ip nat {
            chain postrouting {
              type nat hook postrouting priority 100;
              oifname "{{ egress_nic }}" masquerade
            }
          }
      notify: Restart nftables

    - name: Ensure nftables service is enabled
      ansible.builtin.systemd:
        name: nftables
        enabled: true
        state: started

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Restart nftables
      ansible.builtin.systemd:
        name: nftables
        state: restarted
